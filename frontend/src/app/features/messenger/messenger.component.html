<div class="messenger-container">
  <div class="header">
    <h1>MySMS Messenger</h1>
    <div class="user-info">
      <span *ngIf="!isInitialized()">Loading...</span>
      <span *ngIf="isInitialized()">{{ currentUser()?.email }}</span>
      <button (click)="logout()" class="logout-btn" [disabled]="!isInitialized()">Logout</button>
    </div>
  </div>

  <div class="content" *ngIf="isInitialized()">
    <div class="compose-section">
      <app-compose-box
        (messageSent)="onMessageSent($event)"
        [apiError]="apiError()"
      ></app-compose-box>
    </div>

    <div class="messages-section">
      <app-message-list></app-message-list>
    </div>
  </div>
</div>
