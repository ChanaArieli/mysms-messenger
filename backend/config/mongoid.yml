development:
  clients:
    default:
      uri: <%= ENV['MONGODB_URI'] || 'mongodb://localhost:27017/mysms_dev' %>
      options:
        retry_writes: true

test:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI_TEST', 'mongodb://localhost:27017/mysms_test') %>

production:
  clients:
    default:
      uri: <%= ENV['MONGODB_URI'] || 'mongodb://localhost:27017/mysms_prod' %>
      options:
        retry_writes: true
        connect_timeout: 2
        socket_timeout: 2
        server_selection_timeout: 2
